name: Bug 报告
description: 程序错误、异常行为或回归问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请确认：
        - 已查阅项目 README 或文档站，尝试自行解决问题；
        - 已搜索现有 Issue（包括已关闭的），确认没有重复内容；
        - 使用的软件版本为最新版，或已在下方明确标注版本号。

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 请填写设置页或安装包文件名中的版本号与构建号。
      placeholder: 例如 1.0.0+1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 详细描述
      description: 清晰、简洁地说明您遇到的问题。
      placeholder: 一句话概括发生了什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供可复现问题的精确步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 输入……
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 您认为正常情况下应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 当前实际发生了什么？可附错误信息、堆栈跟踪或截图（直接拖入输入框）。
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      description: 出现问题时使用的平台。
      options:
        - Android
        - iOS
        - Windows
        - macOS
        - Linux
        - 其它
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: 系统版本与设备
      description: 请填写操作系统版本、设备型号或架构；桌面端也可填写安装包类型。
      placeholder: 例如 Android 15 / Pixel 7，Windows 11 24H2 / x64
    validations:
      required: true

  - type: dropdown
    id: repro
    attributes:
      label: 是否可稳定复现
      options:
        - 总是复现
        - 偶尔复现
        - 仅出现一次
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 日志与附加材料
      description: 采集问题可附采集中心「最近日志」，CLI 问题可附 `app/logs/<run-id>.jsonl`，也可附截图、录屏、配置或系统崩溃信息。可直接拖拽文件到输入框上传。
      placeholder: 粘贴日志片段或拖入截图 / 日志文件。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 自检清单
      description: 提交前请确认以下事项。
      options:
        - label: 我已提供所有必要信息，确保他人可以复现或理解。
          required: true
        - label: 我已移除敏感信息（如 BDUSS、Cookie、密码、密钥、私人路径）。
          required: true
